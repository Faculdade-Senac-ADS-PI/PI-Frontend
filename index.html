<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#111731" />
    <meta
      name="description"
      content="Plataforma de divulgação de serviços e contratação de trabalhadores autônomos."
    />
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem("chamaserv-theme")
          const theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
          const root = document.documentElement
          root.classList.toggle("dark", theme === "dark")
          root.classList.toggle("light", theme === "light")
          root.dataset.theme = theme
          root.style.colorScheme = theme
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", theme === "dark" ? "#111731" : "#fcfbf8")
        } catch {
          /* localStorage can be unavailable in private contexts. */
        }
      })()
    </script>
    <title>ChamaServ — Contrate profissionais autônomos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
